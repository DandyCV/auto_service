app = "auto-service"
primary_region = "lhr"
console_command = "/rails/bin/rails console"

[build]

[env]
  PORT = "3000"
  RAILS_MAX_THREADS = "5"
  WEB_CONCURRENCY = "1"
  DATABASE_PATH = "/data/production.sqlite3"
  CACHE_DATABASE_PATH = "/data/production_cache.sqlite3"
  QUEUE_DATABASE_PATH = "/data/production_queue.sqlite3"
  CABLE_DATABASE_PATH = "/data/production_cable.sqlite3"
  SOLID_QUEUE_IN_PUMA = "false"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "45s"
    interval = "30s"
    method = "GET"
    path = "/up"
    timeout = "15s"

[[mounts]]
  source = "data"
  destination = "/data"

[processes]
  app = "/rails/bin/docker-entrypoint ./bin/rails server -b 0.0.0.0 -p 3000"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
